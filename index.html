<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7df">
  <title>天秤之城：平行時空</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f6b73c'/%3E%3Cpath d='M32 13v37M18 50h28M16 21h32M19 21l-8 15h16L19 21zm26 0-8 15h16L45 21z' fill='none' stroke='%233b2d64' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="statusHeader" class="status-header hidden" aria-label="城市狀態">
      <button class="brand" data-action="go-map" aria-label="回到城市地圖">
        <span class="brand-mark">⚖️</span>
        <span><strong>天秤之城</strong><small>平行時空</small></span>
      </button>
      <div class="meters">
        <div class="meter meter-fair" title="做決定前，先找線索，也要公平對待每個人">
          <span class="meter-icon">⚖️</span>
          <span class="meter-copy"><b>公平規則</b><i><span id="fairFill"></span></i></span>
          <strong id="fairValue">6</strong>
        </div>
        <div class="meter meter-care" title="想一想別人的心情和需要">
          <span class="meter-icon">❤️</span>
          <span class="meter-copy"><b>關心別人</b><i><span id="careFill"></span></i></span>
          <strong id="careValue">6</strong>
        </div>
        <div class="meter meter-order" title="讓規則做得到，也讓大家保持安全">
          <span class="meter-icon">🛡️</span>
          <span class="meter-copy"><b>安全秩序</b><i><span id="orderFill"></span></i></span>
          <strong id="orderValue">6</strong>
        </div>
      </div>
      <div class="header-actions">
        <button class="round-button" id="soundButton" data-action="toggle-sound" aria-label="開關音效">🔊</button>
        <button class="round-button" data-action="reset" aria-label="重新開始">↻</button>
      </div>
    </header>

    <main id="game" tabindex="-1" aria-live="polite"></main>

    <div id="toast" class="toast" role="status"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
